name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Validate script permissions and structure
        run: |
          test -x shipsafe
          for script in scripts/*.sh; do
            test -f "$script"
          done
          test -f tests/deploy.bats

      - name: Run ShellCheck
        run: shellcheck shipsafe scripts/*.sh

      - name: Run Bats tests
        run: bats tests/deploy.bats
